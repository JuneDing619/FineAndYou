<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>财务主题分析场景平台</title>
  <meta name="description" content="财务主题分析场景平台，覆盖战略财务、司库财务、共享财务和业务财务四大分析域。">
  <style>
    :root {
      --fr-blue-900: #17346e;
      --fr-blue-800: #0055cc;
      --fr-blue-700: #0086e6;
      --fr-blue-500: #3d93ff;
      --fr-cyan: #00ace6;
      --fr-mint: #35db9b;
      --fr-teal: #3fc4a9;
      --fr-indigo: #5c6cff;
      --fr-violet: #7a73fa;
      --fr-amber: #f7b65c;
      --fr-orange: #f39600;
      --fr-page: #edefff;
      --fr-page-soft: #f3fcff;
      --fr-surface: rgba(255, 255, 255, 0.82);
      --fr-surface-strong: rgba(255, 255, 255, 0.96);
      --fr-line: rgba(184, 190, 204, 0.62);
      --fr-text: #0f0f0f;
      --fr-text-title: #17346e;
      --fr-text-body: #566280;
      --fr-success: #1f9d62;
      --fr-shadow-sm: 0 10px 26px rgba(0, 85, 204, 0.08);
      --fr-shadow-md: 0 18px 48px rgba(0, 85, 204, 0.12);
      --fr-shadow-lg: 0 28px 72px rgba(0, 85, 204, 0.14);
      --radius-lg: 22px;
      --radius-md: 16px;
      --container: 1320px;
      --ease: 220ms cubic-bezier(.2, .8, .2, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--fr-text);
      font-family: "Microsoft YaHei", "PingFang SC", "SF Pro Display", Arial, sans-serif;
      background:
        radial-gradient(circle at 8% 8%, rgba(0, 134, 230, 0.16), transparent 24%),
        radial-gradient(circle at 92% 4%, rgba(0, 172, 230, 0.13), transparent 20%),
        radial-gradient(circle at 46% 92%, rgba(92, 108, 255, 0.1), transparent 28%),
        linear-gradient(180deg, #f8fcff 0%, var(--fr-page-soft) 44%, var(--fr-page) 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(0, 134, 230, 0.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 134, 230, 0.026) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.86), transparent 95%);
    }

    body::after {
      content: "";
      position: fixed;
      top: 110px;
      right: -150px;
      z-index: -1;
      width: 480px;
      height: 480px;
      border-radius: 34px;
      transform: rotate(45deg);
      pointer-events: none;
      opacity: 0.36;
      background:
        radial-gradient(circle, rgba(0, 134, 230, 0.2) 0 13px, transparent 14px 28px, rgba(0, 172, 230, 0.14) 29px 40px, transparent 41px),
        linear-gradient(180deg, rgba(255, 255, 255, 0.12), transparent);
    }

    button {
      border: 0;
      color: inherit;
      font: inherit;
      background: none;
      cursor: pointer;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .shell {
      width: min(calc(100% - 32px), var(--container));
      margin: 0 auto;
      padding: 18px 0 34px;
    }

    .topbar {
      position: sticky;
      top: 14px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
      min-height: 68px;
      padding: 16px 22px;
      border: 1px solid rgba(204, 228, 255, 0.88);
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(232, 244, 255, 0.72)),
        rgba(255, 255, 255, 0.76);
      box-shadow: 0 16px 38px rgba(23, 52, 110, 0.06);
      backdrop-filter: blur(20px) saturate(135%);
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 12px;
      color: inherit;
      text-decoration: none;
    }

    .brand-mark {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-mark img {
      display: block;
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .brand-copy {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .brand-title {
      color: var(--fr-text-title);
      font-size: clamp(1.08rem, 1.5vw, 1.36rem);
      font-weight: 900;
      line-height: 1.24;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-subtitle {
      color: var(--fr-text-body);
      font-size: 0.86rem;
      line-height: 1.5;
    }

    .tabs-wrap {
      position: sticky;
      top: 96px;
      z-index: 18;
      margin-top: 20px;
      padding: 12px;
      border: 1px solid rgba(218, 222, 230, 0.72);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 18px 36px rgba(0, 85, 204, 0.05);
      backdrop-filter: blur(14px);
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 134, 230, 0.28) transparent;
    }

    .tabs {
      display: flex;
      flex-wrap: nowrap;
      gap: 10px;
      min-width: max-content;
    }

    .tab-btn {
      display: grid;
      flex: 1 0 166px;
      gap: 3px;
      align-content: center;
      justify-items: center;
      min-height: 64px;
      padding: 12px 14px;
      border: 1px solid transparent;
      border-radius: 16px;
      color: var(--fr-text-body);
      white-space: nowrap;
      transition: transform var(--ease), box-shadow var(--ease), border-color var(--ease), background var(--ease), color var(--ease);
    }

    .tab-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(0, 85, 204, 0.1);
      background: rgba(255, 255, 255, 0.76);
    }

    .tab-btn strong {
      color: inherit;
      font-size: 0.94rem;
      line-height: 1.35;
    }

    .tab-btn span {
      color: inherit;
      font-size: 0.76rem;
      line-height: 1.3;
    }

    .tab-btn.is-active {
      color: #fff;
      border-color: rgba(0, 134, 230, 0.28);
      background: linear-gradient(180deg, rgba(0, 134, 230, 0.98), rgba(0, 85, 204, 0.98));
      box-shadow: 0 18px 30px rgba(0, 134, 230, 0.2);
    }

    .hero {
      position: relative;
      overflow: hidden;
      margin-top: 18px;
      padding: 24px 28px;
      border: 1px solid rgba(218, 222, 230, 0.76);
      border-radius: 24px;
      background:
        radial-gradient(circle at 0 0, rgba(255, 255, 255, 0.95), transparent 34%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(243, 250, 255, 0.9));
      box-shadow: var(--fr-shadow-md);
    }

    .hero::before,
    .section-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 100% 0, rgba(0, 172, 230, 0.1), transparent 26%),
        radial-gradient(circle at 0 100%, rgba(0, 134, 230, 0.08), transparent 20%);
    }

    .hero-grid {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 10px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid rgba(0, 134, 230, 0.14);
      border-radius: 999px;
      color: var(--fr-blue-700);
      background: rgba(232, 244, 255, 0.88);
      font-size: 0.84rem;
      font-weight: 900;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--fr-blue-700), var(--fr-cyan));
      box-shadow: 0 0 0 6px rgba(0, 134, 230, 0.1);
    }

    .hero h1 {
      color: var(--fr-text-title);
      font-size: clamp(1.18rem, 2.1vw, 1.86rem);
      line-height: 1.25;
      letter-spacing: 0;
    }

    .hero h1 span {
      color: var(--fr-blue-700);
    }

    .hero-desc {
      max-width: 1080px;
      color: var(--fr-text-body);
      font-size: 0.96rem;
      line-height: 1.68;
    }

    .architecture-card,
    .section-card {
      position: relative;
      overflow: hidden;
      margin-top: 20px;
      padding: 28px;
      border: 1px solid rgba(218, 222, 230, 0.76);
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(243, 250, 255, 0.92));
      box-shadow: var(--fr-shadow-md);
    }

    .section-card.is-hidden,
    .architecture-card.is-hidden {
      display: none;
    }

    .section-head {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
    }

    .section-title {
      position: relative;
      padding-left: 16px;
      color: var(--fr-text-title);
      font-size: clamp(1.12rem, 1.45vw, 1.42rem);
      line-height: 1.2;
    }

    .section-title::before {
      content: "";
      position: absolute;
      top: 0.16em;
      bottom: 0.16em;
      left: 0;
      width: 4px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--fr-blue-700), var(--fr-cyan));
      box-shadow: 0 0 0 6px rgba(204, 228, 255, 0.9);
    }

    .section-desc {
      margin-top: 10px;
      max-width: 680px;
      color: var(--fr-text-body);
      font-size: 0.94rem;
      line-height: 1.72;
    }

    .map-layout {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(260px, 0.9fr) minmax(320px, 1.1fr) minmax(260px, 0.9fr);
      grid-template-areas:
        "strategy core treasury"
        "shared core business";
      gap: 16px;
      align-items: stretch;
    }

    .map-core,
    .domain-panel {
      border: 1px solid rgba(204, 228, 255, 0.86);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 8px 22px rgba(23, 52, 110, 0.045);
    }

    .map-core {
      grid-area: core;
      display: grid;
      align-content: center;
      gap: 18px;
      min-height: 480px;
      padding: 24px;
      text-align: center;
      border-color: rgba(0, 134, 230, 0.22);
      background:
        radial-gradient(circle at 50% 0, rgba(0, 134, 230, 0.13), transparent 40%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(243, 250, 255, 0.9));
    }

    .core-icon {
      display: grid;
      place-items: center;
      width: 78px;
      height: 78px;
      margin: 0 auto;
      border-radius: 24px;
      color: #fff;
      background: linear-gradient(135deg, var(--fr-blue-700), var(--fr-blue-800));
      box-shadow: 0 20px 34px rgba(0, 85, 204, 0.16);
    }

    .core-icon svg,
    .title-icon svg,
    .domain-icon svg,
    .icon-btn svg,
    .btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .map-core h2 {
      color: var(--fr-text-title);
      font-size: clamp(1.36rem, 2vw, 1.92rem);
      line-height: 1.22;
    }

    .map-core p {
      color: var(--fr-text-body);
      font-size: 0.96rem;
      line-height: 1.7;
    }

    .flow-steps {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin-top: 4px;
    }

    .flow-steps span {
      display: grid;
      place-items: center;
      min-height: 56px;
      padding: 8px;
      border: 1px solid rgba(0, 134, 230, 0.1);
      border-radius: 12px;
      color: var(--fr-blue-700);
      background: rgba(232, 244, 255, 0.68);
      font-size: 0.72rem;
      font-weight: 900;
      line-height: 1.35;
    }

    .domain-panel {
      display: grid;
      align-content: start;
      gap: 14px;
      min-height: 232px;
      padding: 20px;
      --domain-color: var(--fr-blue-700);
    }

    .domain-panel[data-domain="strategy"] {
      grid-area: strategy;
      --domain-color: var(--fr-blue-700);
    }

    .domain-panel[data-domain="treasury"] {
      grid-area: treasury;
      --domain-color: var(--fr-teal);
    }

    .domain-panel[data-domain="shared"] {
      grid-area: shared;
      --domain-color: var(--fr-indigo);
    }

    .domain-panel[data-domain="business"] {
      grid-area: business;
      --domain-color: var(--fr-orange);
    }

    .domain-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--fr-text-title);
      font-size: 1rem;
      line-height: 1.3;
    }

    .domain-title-main {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      gap: 10px;
    }

    .domain-icon,
    .title-icon {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(135deg, var(--domain-color), color-mix(in srgb, var(--domain-color) 62%, var(--fr-cyan)));
      box-shadow: 0 10px 20px rgba(0, 134, 230, 0.12);
    }

    .domain-badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 9px;
      border-radius: 999px;
      color: var(--domain-color);
      background: color-mix(in srgb, var(--domain-color) 10%, white);
      font-size: 0.72rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .domain-desc {
      color: var(--fr-text-body);
      font-size: 0.86rem;
      line-height: 1.6;
    }

    .domain-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .domain-chips span {
      min-height: 28px;
      padding: 5px 9px;
      border: 1px solid rgba(0, 134, 230, 0.1);
      border-radius: 8px;
      color: var(--domain-color);
      background: color-mix(in srgb, var(--domain-color) 8%, white);
      font-size: 0.74rem;
      font-weight: 900;
      line-height: 1.35;
    }

    .agent-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .agent-card {
      position: relative;
      display: grid;
      grid-template-rows: minmax(0, 274px) 60px;
      min-height: 336px;
      overflow: hidden;
      border: 1px solid rgba(218, 222, 230, 0.9);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 12px 30px rgba(23, 52, 110, 0.08);
      transition: transform var(--ease), box-shadow var(--ease), border-color var(--ease);
    }

    .agent-card:hover {
      transform: translateY(-2px);
      border-color: rgba(0, 134, 230, 0.2);
      box-shadow: 0 18px 38px rgba(23, 52, 110, 0.11);
    }

    .card-main {
      display: grid;
      gap: 14px;
      align-content: start;
      padding: 24px 24px 14px;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .agent-title {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 12px;
      color: var(--fr-text-title);
      font-size: clamp(0.96rem, 1.15vw, 1.08rem);
      line-height: 1.3;
    }

    .agent-title-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .category-tag,
    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .category-tag {
      color: var(--fr-blue-700);
      border: 1px solid rgba(0, 134, 230, 0.14);
      background: rgba(232, 244, 255, 0.88);
    }

    .status {
      color: var(--fr-blue-700);
      background: rgba(0, 134, 230, 0.12);
      border-radius: 8px;
    }

    .pain {
      color: var(--fr-text-body);
      font-size: 0.88rem;
      font-weight: 400;
      line-height: 1.72;
    }

    .pain mark {
      padding: 0 2px;
      color: var(--fr-blue-800);
      background: transparent;
    }

    .pain .ai {
      color: var(--fr-orange);
    }

    .agent-meta {
      display: grid;
      gap: 9px;
      margin-top: 2px;
    }

    .meta-row {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 12px;
      align-items: baseline;
      color: var(--fr-text-body);
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .meta-value {
      color: #2f3b52;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-actions {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      min-height: 60px;
      padding: 12px 24px;
      border-top: 1px solid rgba(218, 222, 230, 0.78);
      background: rgba(255, 255, 255, 0.76);
    }

    .action-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      max-width: 100%;
      min-width: 0;
    }

    .link-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid rgba(0, 134, 230, 0.16);
      border-radius: 10px;
      color: var(--fr-blue-700);
      background: rgba(232, 244, 255, 0.72);
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1.45;
      white-space: nowrap;
      box-shadow: none;
      transition: color var(--ease), background var(--ease), transform var(--ease), box-shadow var(--ease), border-color var(--ease);
    }

    .link-action:hover {
      color: var(--fr-blue-800);
      background: rgba(232, 244, 255, 0.96);
      border-color: rgba(0, 134, 230, 0.28);
      box-shadow: 0 8px 18px rgba(0, 134, 230, 0.08);
      transform: translateY(-2px);
    }

    .link-action.demo,
    .link-action.case {
      color: #667792;
      border-color: rgba(102, 119, 146, 0.18);
      background: rgba(244, 247, 251, 0.92);
      cursor: default;
    }

    .link-action.demo:hover,
    .link-action.case:hover {
      color: #667792;
      border-color: rgba(102, 119, 146, 0.18);
      background: rgba(244, 247, 251, 0.92);
      box-shadow: none;
      transform: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 900;
      transition: transform var(--ease), box-shadow var(--ease), border-color var(--ease), background var(--ease);
    }

    .btn-secondary {
      color: var(--fr-blue-700);
      border: 1px solid rgba(0, 134, 230, 0.18);
      background: rgba(255, 255, 255, 0.84);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(10, 31, 62, 0.34);
      backdrop-filter: blur(12px);
    }

    .modal.is-open {
      display: flex;
    }

    .modal-panel {
      position: relative;
      width: min(920px, 100%);
      max-height: min(780px, calc(100vh - 44px));
      overflow: auto;
      border: 1px solid rgba(218, 222, 230, 0.76);
      border-radius: 28px;
      background:
        radial-gradient(circle at 0 0, rgba(255, 255, 255, 0.98), transparent 34%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(243, 250, 255, 0.96));
      box-shadow: 0 30px 90px rgba(0, 31, 84, 0.26);
      animation: modal-in 180ms ease;
    }

    @keyframes modal-in {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      padding: 26px 28px 18px;
      border-bottom: 1px solid rgba(0, 134, 230, 0.1);
    }

    .modal-title-wrap {
      display: grid;
      gap: 12px;
    }

    .modal-title-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .modal h2 {
      color: var(--fr-text-title);
      font-size: clamp(1.52rem, 2.6vw, 2.26rem);
      line-height: 1.2;
    }

    .modal-summary {
      max-width: 760px;
      color: var(--fr-text-body);
      font-size: 1rem;
      line-height: 1.75;
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 40px;

      height: 7px;

    function plainText(html) {
      const template = document.createElement("template");
      template.innerHTML = html;
      return template.content.textContent.replace(/\s+/g, " ").trim();
    }

      return role.split("/").map((item) => item.trim()).filter(Boolean);

      const result = findScenario(id);
      if (!result) return;
      const { domain, scenario } = result;
      const knowledge = modalKnowledge[scenario.id] || {

        sources: ["财务系统", "业务系统", "管理台账和指标口径库"]
      };
      modalCategory.textContent = domain.name;
      modalTitle.textContent = scenario.title;
      modalSummary.textContent = scenario.summary;
      modalDetails.innerHTML = `
        ${detailCard("关键用户", splitRole(scenario.role))}
        ${detailCard("业务痛点", [plainText(scenario.pain)])}
        ${detailCard("分析场景", scenario.details.scene)}
        ${detailCard("核心指标", knowledge.metrics)}
        ${detailCard("数据来源", knowledge.sources)}
        ${detailCard("预期收益", [scenario.value])}
      `;
      modal.classList.add("is-open");
      modal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      document.querySelector("#closeModal").focus();
    }

    closeButtons.forEach((button) => button.addEventListener("click", closeModal));

    modal.addEventListener("click", (event) => {
      if (event.target === modal) closeModal();
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && modal.classList.contains("is-open")) closeModal();
    });
  </script>
</body>
</html>

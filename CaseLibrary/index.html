<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>案例库建设中 | FineAndYou</title>
  <meta name="description" content="FineAndYou 案例库建设中页面。">
  <link rel="stylesheet" href="../tokens.css">
  <style>
    :root {
      --navy-900: #17346E;
      --navy-800: #0055CC;
      --navy-700: #0086E6;
      --sky-500: #00ACE6;
      --sky-200: #CCE4FF;
      --bg: #F0F4F8;
      --paper: rgba(255, 255, 255, 0.94);
      --text-soft: #566280;
      --radius-xl: 22px;
      --radius-lg: 16px;
      --shadow-lg: 0 26px 68px rgba(23, 52, 110, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: var(--font-family);
      color: var(--navy-900);
      background:
        radial-gradient(circle at 8% 10%, rgba(0, 134, 230, 0.14), transparent 22%),
        radial-gradient(circle at 92% 6%, rgba(0, 172, 230, 0.12), transparent 18%),
        linear-gradient(180deg, #ffffff 0%, #F5FAFF 48%, var(--bg) 100%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(calc(100% - 32px), 1120px);
      margin: 0 auto;
      padding: 22px 0 34px;
    }

    .topbar,
    .hero,
    .card {
      border-radius: var(--radius-lg);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(232, 244, 255, 0.76)),
        var(--paper);
      border: 1px solid rgba(204, 228, 255, 0.88);
      box-shadow: 0 16px 38px rgba(23, 52, 110, 0.06);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 15px 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand img {
      width: 34px;
      display: block;
    }

    .brand-copy {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .brand-copy strong {
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-copy span {
      color: var(--text-soft);
      font-size: 0.86rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      color: var(--navy-700);
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(128, 202, 255, 0.58);
      font-weight: 700;
      white-space: nowrap;
    }

    .hero {
      position: relative;
      overflow: hidden;
      margin-top: 18px;
      padding: 32px;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 320px;
      height: 320px;
      right: -120px;
      top: -130px;
      border-radius: 22px;
      transform: rotate(45deg);
      background:
        radial-gradient(circle, rgba(0, 134, 230, 0.14) 0 12px, transparent 13px 26px, rgba(0, 172, 230, 0.09) 27px 36px, transparent 37px);
      opacity: 0.28;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 16px;
      max-width: 780px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      color: var(--navy-700);
      background: rgba(0, 134, 230, 0.08);
      font-size: 0.86rem;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.2rem);
      line-height: 1.12;
      letter-spacing: -0.035em;
    }

    p {
      margin: 0;
      color: var(--text-soft);
      line-height: 1.76;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .card {
      padding: 18px;
      display: grid;
      gap: 8px;
      box-shadow: none;
    }

    .card strong {
      color: var(--navy-900);
      font-size: 1rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 24px;
      padding: 0 9px;
      border-radius: 999px;
      color: #F39600;
      background: rgba(243, 150, 0, 0.08);
      border: 1px solid rgba(243, 150, 0, 0.22);
      font-size: 0.75rem;
      font-weight: 800;
    }

    @media (max-width: 820px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .shell {
        width: min(calc(100% - 14px), 1120px);
        padding-top: 10px;
      }

      .topbar,
      .hero,
      .card {
        padding: 16px;
        border-radius: 18px;
      }

      .brand img {
        width: 30px;
      }

      .brand-copy span {
        font-size: 0.76rem;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <img src="../assets/fanruan-mark.svg" alt="帆软 Logo">
        <div class="brand-copy">
          <strong>FineAndYou｜总工办·知识资产开源阵地</strong>
          <span>案例库作为跨场景客户材料沉淀入口，正在建设中。</span>
        </div>
      </div>
      <a class="back-link" href="../">返回工作台</a>
    </header>

    <main>
      <section class="hero">
        <div class="hero-content">
          <span class="eyebrow">Case Library</span>
          <h1>案例库建设中</h1>
          <p>后续这里会按行业、客户类型、场景和产品组合沉淀可复用案例。当前先保留明确入口，避免一线同学从首页进入时遇到 404。</p>
        </div>
      </section>

      <section class="grid" aria-label="案例库建设计划">
        <article class="card">
          <span class="status">建设中</span>
          <strong>按场景归档</strong>
          <p>优先承接数字化经分会、财务主题分析、穿透式监管和财经 Agent 平台的案例材料。</p>
        </article>
        <article class="card">
          <span class="status">建设中</span>
          <strong>按客户类型筛选</strong>
          <p>支持民营企业、央国企/国资、集团型企业等一线常用筛选方式。</p>
        </article>
        <article class="card">
          <span class="status">建设中</span>
          <strong>沉淀标准口径</strong>
          <p>后续统一沉淀客户背景、项目价值、方案打法、复用边界与对外可讲口径。</p>
        </article>
      </section>
    </main>
  </div>
</body>
</html>
